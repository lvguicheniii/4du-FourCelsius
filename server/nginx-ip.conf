server {
    listen 80 default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://your-api.example$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    server_name your-api.example _;

    ssl_certificate /etc/letsencrypt/live/your-api.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-api.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 100m;

    location = /community {
        return 301 /community/;
    }

    # 独立网页社区静态目录；与 Node 服务、管理后台和 App 资源完全分离。
    location ^~ /community/ {
        alias /var/www/sidu-community-web/current/;
        try_files $uri $uri/ /community/index.html;
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self' wss:; img-src 'self' data: blob: https:; media-src 'self' blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }

    location /admin {
        limit_req zone=sidu_admin_per_ip burst=20 nodelay;
        limit_conn sidu_connections_per_ip 20;
        proxy_pass http://127.0.0.1:3001/admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Node validates the EAS authorization and then hands the cached bundle to
    # Nginx through X-Accel-Redirect. Large OTA downloads therefore do not hold
    # application-server connections while many devices update together.
    location ^~ /_ota-assets/ {
        internal;
        alias /opt/sidu/.cache/ota-assets/;
        sendfile on;
        tcp_nopush on;
        expires max;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location ^~ /_ota-self-hosted-assets/ {
        internal;
        alias /opt/sidu/.cache/ota-self-hosted/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ^~ /app-downloads/ {
        alias /var/lib/sidu-app-releases/;
        sendfile on;
        tcp_nopush on;
        default_type application/vnd.android.package-archive;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ^~ /api/app-updates/ota/assets/ {
        limit_req zone=sidu_api_per_ip burst=60 nodelay;
        limit_conn sidu_connections_per_ip 50;
        proxy_pass http://127.0.0.1:3001/api/app-updates/ota/assets/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api/ {
        limit_req zone=sidu_api_per_ip burst=60 nodelay;
        limit_conn sidu_connections_per_ip 50;
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /ws {
        limit_conn sidu_connections_per_ip 50;
        access_log off;
        proxy_pass http://127.0.0.1:3001/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 75s;
    }

    location /uploads/ {
        alias /opt/sidu/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }
}
