server {
    listen 80;
    listen 443 ssl;
    server_name your-web.example www.your-web.example download.your-web.example;

    ssl_certificate /etc/letsencrypt/live/your-web.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-web.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /community {
        return 301 /community/;
    }

    location ^~ /community/ {
        alias /var/www/sidu-community-web/current/;
        try_files $uri $uri/ /community/index.html;
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self' wss:; img-src 'self' data: blob: https:; media-src 'self' blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }

    # 管理后台
    location /admin {
        limit_req zone=sidu_admin_per_ip burst=20 nodelay;
        limit_conn sidu_connections_per_ip 20;
        proxy_pass http://127.0.0.1:3001/admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # API 反向代理
    location ^~ /_ota-assets/ {
        internal;
        alias /opt/sidu/.cache/ota-assets/;
        sendfile on;
        tcp_nopush on;
        expires max;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location ^~ /_ota-self-hosted-assets/ {
        internal;
        alias /opt/sidu/.cache/ota-self-hosted/assets/;
        sendfile on;
        tcp_nopush on;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ^~ /app-downloads/ {
        alias /var/lib/sidu-app-releases/;
        sendfile on;
        tcp_nopush on;
        default_type application/vnd.android.package-archive;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ^~ /api/app-updates/ota/assets/ {
        limit_req zone=sidu_api_per_ip burst=60 nodelay;
        limit_conn sidu_connections_per_ip 50;
        proxy_pass http://127.0.0.1:3001/api/app-updates/ota/assets/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api/ {
        limit_req zone=sidu_api_per_ip burst=60 nodelay;
        limit_conn sidu_connections_per_ip 50;
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 20m;
    }

    location /ws {
        limit_conn sidu_connections_per_ip 50;
        access_log off;
        proxy_pass http://127.0.0.1:3001/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
    }

    # 上传文件
    location /uploads/ {
        alias /opt/sidu/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
