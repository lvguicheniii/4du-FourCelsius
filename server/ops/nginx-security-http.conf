# Loaded from nginx's http context via /etc/nginx/conf.d/*.conf.
# The burst allowance keeps normal mobile startup traffic smooth while limiting
# sustained abusive traffic from one public IP.
limit_req_zone $binary_remote_addr zone=sidu_api_per_ip:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=sidu_admin_per_ip:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=sidu_connections_per_ip:10m;

limit_req_status 429;
limit_conn_status 429;
server_tokens off;

ssl_session_timeout 1d;
ssl_session_cache shared:SIDU_SSL:10m;
ssl_session_tickets off;
