server {
    # Replace this documentation-only address with the server's private IP.
    listen 10.0.0.10:3001 default_server;
    server_name _;
    server_tokens off;

    # Keep the pre-filing IP endpoint stable while preventing direct access
    # to the Node.js process. Uploads are capped by the app at 100 MiB.
    client_max_body_size 110m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
